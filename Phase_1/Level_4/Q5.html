<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math and number logic</title>
</head>
  <body>
  <script>
  let a = prompt("Enter the value for A:");
  let b = prompt("Enter the value for B:");
 let   A= Number(a);
 let  B = Number(b);
    let check1 = A>0 && B>0;
   let sum = A+B ;
    let check2 = sum<100 ;
    if(check1&&check2){
      console.log("Both are positive and less than 100, valid",sum);
    }else {
      console.log("It is invalid number")
    }
    
</script>
</body>
</html>
