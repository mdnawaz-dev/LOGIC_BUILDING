  <body>
  <script>
  let time = prompt("Enter the time to know it is AM or PM:");
   let tm= Number(time);

      console.log("AM");
    }else if(tm>=12 && tm<=23){
      console.log("PM");
    } else {
      console.log("you have entered wrong timings");
    }

    
    
</script>
