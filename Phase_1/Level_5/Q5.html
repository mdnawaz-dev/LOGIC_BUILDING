<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creative , Tricky Logical Scenarios </title>
</head>
  <body>
  <script>
  let num = prompt("Enter the 3 digit Number:");
  let n = Number(num);
    let last = n%10;
    let temp = Math.floor(n/10);
    let middle = temp%10;
    let first = Math.floor(temp/10);
    let sum = last+first;
    if(sum==middle){
      console.log("They are equal",sum,middle);
    }else{
      console.log("They are not equal");
    }
    
</script>
</body>
</html>
