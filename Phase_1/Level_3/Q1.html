<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math and number logic</title>
</head>
  <body>
  <script>
  let num= prompt("Enter 3digit Number:");
let n = Number(num);
let last = n%10;
 let temp =Math.floor(n/10);
    let middle = temp%10;
    let first = Math.floor(temp/10);
    if(last!==middle&&middle!==first&&first!==last){
console.log("The three digits are distinct");
}
else{
console.log("three digits are not distinct");
}
  
   
</script>
</body>
</html>
