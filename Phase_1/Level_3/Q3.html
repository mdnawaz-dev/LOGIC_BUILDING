<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math and number logic</title>
</head>
  <body>
  <script>
  let num= prompt("Enter 3digit Number:");
    let n = Number(num);
  if(n>=0&&n<=9){
    console.log("single digit");
  } else if(n>=10&&n<=99) {
    console.log("double digit");
  } else {
    console.log("Multi digit");
  }
    
</script>
</body>
</html>
