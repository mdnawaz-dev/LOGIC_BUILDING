<!DOCTYPE html>

 <title>Pattern & Printing problems</title>
</head>
<body>

<script>
function removeSpaces(str) {
  if (str.length === 0) {
    return "";
  }

  if (str[0] === " ") {
  return str[0] + removeSpaces(str.slice(1));
  }
}
  console.log(removeSpaces("I love coding 173"));
</script>

</body>
