<!DOCTYPE html>
<html>
<head>
 <title>String-based Recursion</title>
</head>
<body>

<script>
function replaceChar(str) {
  if (str.length === 0) {
    return "";
  }

  if (str[0] === "a") {
  return "x" + replaceChar(str.slice(1));
  }
  return str[0] + replaceChar(str.slice(1));
}
  console.log(replaceChar("Nawaz"));
  console.log(replaceChar("Banana"));
</script>

</body>
</html>
