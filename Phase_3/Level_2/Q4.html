<!DOCTYPE html>
<html>
<head>
 <title>Number based Recursive Thinking</title>
</head>
<body>

<script>
function gcd(a, b) {
    if (b === 0) {
        return a;
    }

    return gcd(b, a % b);
}

console.log(gcd(12, 18)); // 6
console.log(gcd(7, 13));  // 1
console.log(gcd(10, 10)); // 10
</script>

</body>
</html>
