<!DOCTYPE html>
<html>
<head>
 <title>Number based Recursive Thinking</title>
</head>
<body>

<script>
  function reverseNumber(n, reverse) {
    if (n === 0) {
        return reverse;
    }

    return reverseNumber(
        Math.floor(n / 10),
        reverse * 10 + (n % 10)
    );
}

let m = 121;
let original = m;

let reversed = reverseNumber(original, 0);

if (original === reversed) {
    console.log("Palindrome");
} else {
    console.log("Not a palindrome");
}
</script>

</body>
</html>
