<!DOCTYPE html>
<html>
<head>
 <title>Number based Recursive Thinking</title>
</head>
<body>

<script>
function reverseNumber(n, reverse) {
    if(n === 0){
      return reverse;
    }

  return reverseNumber(
    Math.floor(n / 10),
    reverse*10 + (n%10);
    );
}
  console.log(reverseNumber(121, 0));
</script>

</body>
</html>
