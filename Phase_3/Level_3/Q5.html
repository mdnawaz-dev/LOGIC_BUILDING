<!DOCTYPE html>
<html>
<head>
 <title>Pattern & Printing problems</title>
</head>
<body>

<script>
function sequence(n) {
  if (n === 0) {
    return;
  }

  console.log(n);       // decreasing
  sequence(n - 1);
  sequence(n + 1);
  console.log(n);       // increasing
}
  sequence(5);
</script>

</body>
</html>
