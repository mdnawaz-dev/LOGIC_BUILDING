<!DOCTYPE html>
<html>
<head>
    <title>Prime Numbers</title>
</head>
<body>

<script>

let n = prompt("Enter the number between 1 and 100:");
n = Number(n);

for(let i = 2; i <= n; i++){

    let isPrime = true;

    for(let j = 2; j <= i - 1; j++){

        if(i % j == 0){
            isPrime = false;
        }

    }

    if(isPrime == true){
        console.log(i + " is prime number");
    }
    else{
        console.log(i + " is not prime number");
    }
}

</script>

</body>
</html>
