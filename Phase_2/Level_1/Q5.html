<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic looping </title>
</head>
  <body>
  <script>
      let n = prompt("Enter the digits:");
    n = Number(n);
    let product = 1;
    while(n>0){
     let lastdigit = n%10;
      product = product*lastdigit;
      n = Math.floor(n/10);
    }
    console.log(product);
</script>
</body>
</html>
