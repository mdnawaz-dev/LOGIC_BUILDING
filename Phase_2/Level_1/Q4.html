<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic looping </title>
</head>
  <body>
  <script>
    let n = prompt("Enter the number for factorial");
    n = Number(n);
    let product = 1;
    for(let i=1; i<=n; i++){
      product = product*i;
    }
    console.log(product);
</script>
</body>
</html>
