<!DOCTYPE html>
<html>
<head>
 <title>Mathematical & Logical Patterns</title>
</head>
<body>

<script>

let a = prompt("Enter the A value to get HCF:");
  let b = prompt("Enter the B value to get HCF:");
  a = Number(a);
  b = Number(b);
for(let i = Math.min(a,b);i >= 1; i--){
  if(a%i==0 && b%i==0){
    console.log("we got HCF",i);
  break;
  }
}
</script>

</body>
</html>
