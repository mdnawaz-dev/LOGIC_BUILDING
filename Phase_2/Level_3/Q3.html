<!DOCTYPE html>

<head>
 <title>Mathematical & Logical Patterns</title>
</head>
<body>

<script>

let a = prompt("Enter the A value to get LCF:");
  let b = prompt("Enter the B value to get LCF:");
  a = Number(a);
  b = Number(b);
for(let i = Math.max(a,b);i <= 1; i++){
  if(i%a==0 && i%b==0){
    console.log("we got LCF",i);
  break;
  }
}
</script>

</body>
