 <title>Logical loop combinations</title>

<body>

<script>
  let sum = 0;
  for (let i = 1; i <= 5; i++) {
    let n = prompt("Enter the 5 numbers :");
  n = Number(n);
    if (n === 0) {
    continue;
    }
    sum = sum + n;
  }
  console.log("Sum is:",sum)
</script>
