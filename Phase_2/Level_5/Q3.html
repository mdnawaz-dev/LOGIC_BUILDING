<!DOCTYPE html>
<html>
<head>
 <title>Logical loop combinations</title>
</head>
<body>

<script>
let n = prompt("Enter the number to check whether it is smallest & largest:");
n = Number(n);
  let smallest = 9;
  let largest = 0;
  while(n>0){
    let digit = n%10;
    n = Math.floor(n/10);
  }
  if(digit <= smallest) {
    console.log("");
  }else if(digit >= largest) {
    console.log("");
 }
  
</script>

</body>
</html>
