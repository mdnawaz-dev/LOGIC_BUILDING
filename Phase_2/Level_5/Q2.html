<!DOCTYPE html>
<html>
<head>
 <title>Logical loop combinations</title>
</head>
<body>

<script>
let n = prompt("Enter the number of digits for palindrome(1-500):");
n = Number(n);
  let n = i;
let original = i;
let reverse = 0;
  for(let i = 1; i<=500; i++ ){
    let lastdigit = n%10;
    reverse = reverse*10 + lastdigit;
    n = Math.floor(n/10);
  }
  if(reverse==original){
    console.log("it is palindrome");
  }else{
    console.log("it is not palindrome");
  }
</script>

</body>
</html>
