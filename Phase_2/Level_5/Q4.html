 <title>Logical loop combinations</title>

<body>

<script>
let n = prompt("Enter the number to its binary:");
n = Number(n);
  for(let i = 1; i <= n; i++) {
    let count = 0;
    let binary = i.toString(2);
    for(let j=0; j < binary.length; j++){
      if (binary[j] === "1") {
         count++;
    
      }
    }
    if (count % 2 == 0) {
    console.log("Even number is:",n)
    }
  }
</script>
