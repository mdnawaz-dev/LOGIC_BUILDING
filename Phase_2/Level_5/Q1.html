<!DOCTYPE html>
<html>
<head>
 <title>Logical loop combinations</title>
</head>
<body>

<script>
let n = prompt("Enter the number of digits from 1 to 100:");
n = Number(n);
let sum = 0;
  while(n>0){
    let lastdigit = n%10;
    sum = sum + lastdigit;
    n = Math.floor(n/10);
  }
  console.log(sum);
</script>

</body>
</html>
