<!DOCTYPE html>
<html>
<head>
 <title>Logical loop combinations</title>
</head>
<body>

<script>
let n = prompt("Enter the number of digits from 1 to 100:");
n = Number(n);
let sum = 0;
  while(n>0){
    let lastdigit = n%10;
    sum = sum + lastdigit;
    n = Math.floor(n/10);
  }
  if(sum%2==0){
    console.log("the given number is even",sum);
  }else{
    console.log("it is not an even number");
  }
</script>

</body>
</html>
