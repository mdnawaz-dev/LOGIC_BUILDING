<!DOCTYPE html>
<html>
<head>
 <title>Patterns printing(stars & Numbers)</title>
</head>
<body>

<script>
let n = prompt("Enter the number of rows:");
n = Number(n);

for(let i = 1; i <= n; i++){
let row = "";
  for(let j = 1; j <= i; j++){
    row = row + j;
  }
    console.log(row);
}
</script>

</body>
</html>
