<!DOCTYPE html>
<html>
<head>
 <title>Searching & Counting Logic</title>
</head>
<body>
<script>
let arr = [10, 20, 30, 40];
  let x = 30; 
  let found = false;

  for(let i=0; i<arr.length; i++){
    if(arr[i] === x){
      console.log("Found at index:",i);
      found = true;
      break;
    }
  }
  if(found === false){
      console.log("Number not found")
  }
</script>
</body>
</html>
