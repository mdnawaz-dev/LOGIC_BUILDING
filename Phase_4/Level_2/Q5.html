<!DOCTYPE html>
<html>
<head>
 <title>Searching & Counting Logic</title>
</head>
<body>
<script>
let arr = [4, 7, 9, 12, 16, 20, 25];
  let count = 0; 

for(let i=0; i<arr.length; i++){
  let sqr = Math.sqrt(arr[i]);
 if(Number.isInteger(sqr)){
   count++;
 }
  }
  console.log("Count of perfect squares:", count);
</script>
</body>
</html>
