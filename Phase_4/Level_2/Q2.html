<!DOCTYPE html>
<html>
<head>
 <title>Searching & Counting Logic</title>
</head>
<body>
<script>
let arr = [10, 20, 30, 40];
  let found = false;
  for(let i=0; i<arr.length; i++){
    for(let j=i+1; j<arr.length; j++){
      if(arr[i] === arr[j]){
      console.log("we got duplicate")
        found = true; 
      }
    }
  }
if (found === true) {
console.log("Duplicate elements found");
} else {
 console.log("All elements are unique");
}
</script>
</body>
</html>
