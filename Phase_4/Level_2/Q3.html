<!DOCTYPE html>
<html>
<head>
 <title>Searching & Counting Logic</title>
</head>
<body>
<script>
let arr = [10, 15, 20, 25, 30];
  let sum = 0;
  for(let i=0; i<arr.length; i++){
    if(arr[i]%2===0){
      sum = sum + arr[i];
    }
  }
  console.log("Sum of even elements:", sum);
</script>
</body>
</html>
