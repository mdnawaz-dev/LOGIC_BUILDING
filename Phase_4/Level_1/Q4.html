<!DOCTYPE html>
<html>
<head>
 <title>Fundamentals of arrays</title>
</head>
<body>
<script>
let arr = [12, 45, 7, 89, 23];

let max = arr[0];
let maxIndex = 0;

  for(let j=0; j<arr.length; j++) {
    if(arr[j]>max){
      max = arr[j];
maxIndex = j;
    }
  }
  console.log("Maximum value:", max);
console.log("Index of maximum element:", maxIndex);
</script>
</body>
</html>
