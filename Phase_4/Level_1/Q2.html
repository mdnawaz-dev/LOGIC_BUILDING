<!DOCTYPE html>
<html>
<head>
 <title>Fundamentals of arrays</title>
</head>
<body>
<script>
let n = prompt("How many elements:");
  let arr = [];
  let sum = 0;
  for(let i=0; i<n; i++){
    arr.push(Number(prompt("Enter the array elements:")));
  }
  for(let j=0; j<arr.length; j++){
    sum = arr[j] + sum;
  }
  console.log(sum);
</script>
</body>
</html>
