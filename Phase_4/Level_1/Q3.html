<!DOCTYPE html>
<html>
<head>
 <title>Fundamentals of arrays</title>
</head>
<body>
<script>
  let n = prompt("How many elements:");
  let arr = [];

  let positive = 0; 
  let negative = 0; 
  let zero = 0; 

  for(let i=0; i<n; i++){
    arr.push(Number(prompt("Enter the Elements:")));
  }

  for(let j=0; j<arr.length; j++){
    if(arr[j] > 0){
      positive++;
    }else if(arr[j] < 0) {
      negative++;
    }else{
      zero++;
    }
  }

  console.log(positive);
  console.log(negative);
  console.log(zero);

</script>
</body>
</html>
