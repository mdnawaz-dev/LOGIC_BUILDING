<!DOCTYPE html>
<html>
<head>
 <title>Fundamentals of arrays</title>
</head>
<body>
<script>
let n = prompt("How many elements:");
  let arr = [];
  for(let i=0; i<n; i++){
    arr.push(Number(prompt("Enter the array elements :")))
  }
  let k = Number(prompt("Enter the value of k:"));
  for (let j = 0; j < arr.length; j++) {
  if(arr[j]>k){
    console.log("Greater than k is",arr[j])
  }
  }
</script>
</body>
</html>
