<!DOCTYPE html>
<html>
<head>
 <title>Logical & Applied Array Problems</title>
</head>
<body>
<script>
let arr = [12, 35, 1, 10, 34, 1];
  let largest = arr[0];
  let smallest = Infinity;
  let sum = 0;
  for (let i=0; i<arr.length; i++){
  
    if(arr[i] > largest){
      largest = arr[i];
    } 
    if(arr[i] < smallest){
      smallest = arr[i];
    }
  }
    let skippedLargest = false;
let skippedSmallest = false;

for(let j=0; j<arr.length; j++){
  
  if (arr[j] === largest && skippedLargest === false) {
  skippedLargest = true;
  } else if (arr[j] === smallest && skippedSmallest === false) {
  skippedSmallest = true;
  }else {
  sum = sum + arr[j];
  }  
  }
  console.log("Sum of all elements:",sum);
</script>
</body>
</html>
