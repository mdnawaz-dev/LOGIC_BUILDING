 <title>Logical & Applied Array Problems</title>

<body>
<script>
let arr = [10, 20, 10, 30, 40, 20, 50];
  let alreadyseen = false; 
  let count = 0;
  for(let i=0; i<arr.length; i++){

    for(let k=0; k<i; k++){
      if(arr[k]===arr[i]){
        alreadyseen = true;
      }
    }
  
  }
if(!alreadyseen){
  count++;
}
  console.log(count);
</script>
