 <title>Aggreagate & Comparative Thinking</title>

<body>
<script>
let arr = [10, 20, 10, 30, 20, 10];
  let alreadySeen = false;
  let count = 0;
  for(let i=0; i<arr.length; i++){
  for (let k = 0; k < i; k++) {
          if(arr[k] === arr[i]){
            alreadySeen = true;
    for(let j=0; j<arr.length; j++){
      if(arr[i]===arr[j]){
      count ++;
      }
      }
    }
    console.log(count);
  }
  }
  }
</script>
