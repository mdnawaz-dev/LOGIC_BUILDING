<!DOCTYPE html>
<html>
<head>
 <title>Aggreagate & Comparative Thinking</title>
</head>
<body>
<script>
let arr = [10, 20, 10, 30, 20, 10];
  for(let i=0; i<arr.length; i++){
    let count = 0;
    for(let j=0; j<arr.length; j++){
      if(arr[i]===arr[j]){
        count ++;
      }
    }
  }
  console.log(count);
</script>
</body>
</html>
