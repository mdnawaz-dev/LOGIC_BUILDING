<!DOCTYPE html>
<html>
<head>
 <title>Aggreagate & Comparative Thinking</title>
</head>
<body>
<script>
let arr1 = [10, 20, 30, 40];
let arr2 = [30, 40, 50, 60];

let result = [];

for (let i = 0; i < arr1.length; i++) {
  for (let j = 0; j < arr2.length; j++) {
    if (arr2[j] === arr1[i] && !result.includes(arr1[i])) {
      result.push(arr1[i]);
    }
  }
}

console.log(result);
</script>
</body>
</html>
