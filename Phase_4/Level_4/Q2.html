<!DOCTYPE html>
<html>
<head>
 <title>Aggreagate & Comparative Thinking</title>
</head>
<body>
<script>
let arr1 = [10, 20, 30];
let arr2 = [40, 50, 60];
  let result = [];
  for(let i=0; i<arr1.length; i++){
    result.push(arr1[i]);
  }
  for(let j=0; j<arr2.length; j++){
    result.push(arr2[j]);
  }
  console.log(result);
</script>
</body>
</html>
